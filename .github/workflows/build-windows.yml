name: Build Windows desktop app

on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Init public submodules only
        # .gitmodules also lists external/feature-specs, a private Belledonne
        # repo we have no access to (and don't need) — Belledonne's own
        # GitLab CI excludes it the same way (GIT_SUBMODULE_PATHS in
        # .gitlab-ci.yml), so only init the ones the build actually needs.
        # gitlab.linphone.org drops connections when git tries to clone all
        # ~35 nested submodules (aom, libvpx, sqlite3, zlib...) in parallel —
        # force one at a time and retry, since already-cloned submodules are
        # skipped on the next attempt.
        shell: pwsh
        run: |
          $maxAttempts = 5
          for ($i = 1; $i -le $maxAttempts; $i++) {
            Write-Output "Submodule update attempt $i/$maxAttempts"
            git submodule update --init --recursive --jobs 1 --depth 1 external/linphone-sdk external/google/gn external/google/crashpad external/google/chromium-depot-tools
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -eq $maxAttempts) { throw "Submodule update failed after $maxAttempts attempts" }
            Write-Output "Attempt $i failed, retrying in 15s..."
            Start-Sleep -Seconds 15
          }

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          modules: "qtnetworkauth"

      - name: Install Ninja and NASM
        run: choco install ninja nasm -y

      - name: Add NASM to PATH
        run: echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: |
          mkdir build-desktop
          cd build-desktop
          cmake .. -G Ninja -DLINPHONESDK_PLATFORM=Desktop -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER=cl.exe -DCMAKE_CXX_COMPILER=cl.exe -DENABLE_UNIT_TESTS=NO -DENABLE_GPL_THIRD_PARTIES=OFF

      - name: Build
        run: |
          cd build-desktop
          cmake --build . --target install --config RelWithDebInfo

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiwicall-desktop-windows
          path: |
            build-desktop/OUTPUT/**
            build-desktop/ninja_buildlog.txt
          if-no-files-found: warn
